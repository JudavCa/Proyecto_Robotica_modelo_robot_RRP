controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1_rev
      - joint2_rev
      - joint3_prism
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
